[build-system]
requires = [ "setuptools>=84.0.0", "wheel",]
build-backend = "setuptools.build_meta"

[project]
name = "mattermost-mcp"
version = "2.4.2"
description = "Mattermost Team Collaboration MCP Server and Agent for Agentic AI!"
readme = "README.md"
classifiers = [ "Development Status :: 4 - Beta", "License :: OSI Approved :: MIT License", "Environment :: Console", "Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3",]
requires-python = ">=3.12"
dependencies = [ "agent-connector-sdk[mcp]>=0.3.8,<1.0.0", "requests>=2.34.2",]
[[project.authors]]
name = "Project Maintainers"
email = "maintainers@users.noreply.github.com"

[project.license]
text = "MIT"

[project.optional-dependencies]
mcp = [ "agent-connector-sdk[mcp]>=0.3.8,<1.0.0",]
all = [ "agent-connector-sdk[mcp]>=0.3.8,<1.0.0",]
test = [ "pytest-xdist>=3.8.0", "pytest>=9.1.1", "pytest-asyncio>=1.4.0", "pytest-cov>=7.1.0",]

[project.scripts]
mattermost-mcp = "mattermost_mcp.mcp_server:mcp_server"

[project.entry-points."agent_connector_sdk.skill_providers"]
mattermost-mcp = "mattermost_mcp.skills"

[project.entry-points."agent_connector_sdk.ontology_providers"]
mattermost-mcp = "mattermost_mcp.ontology"

[project.entry-points."agent_connector_sdk.source_connector_providers"]
mattermost-mcp = "mattermost_mcp.connectors"

[project.entry-points."agent_connector_sdk.prompt_providers"]
mattermost-mcp = "mattermost_mcp.prompts"

[tool.uv.workspace]
members = ["."]

[tool.setuptools]
include-package-data = true

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[dependency-groups]
dev = [ "pytest-timeout>=2.4.0",]

[tool.setuptools.package-data]
mattermost_mcp = [ "mcp_config.json", "operation_manifest.json", "agent_data/**", "prompts/**", "skills/**", "ontology/**", "connectors/**",]

[tool.ruff.lint]
select = [ "E", "F", "I", "UP", "B",]
ignore = [ "E402", "E501", "B008",]

[tool.setuptools.packages.find]
where = [ ".",]

[tool.uv]
override-dependencies = [
    "fastmcp-slim[client,server]>=4.1.0",
]


[tool.pipelines]
# Operations absent from the Mattermost v11.11.1 API v4 spec (the deployed server's
# version), so the regenerated client no longer serves them.
retired-tools = [
  "mattermost_get_bulk_reactions",
  # split by the SDK from the legacy mattermost_mcp_reactions router (removed in
  # 2.4.1); it called the retired get_bulk_reactions and was untyped.
  "mattermost_mcp_reactions_get_bulk_reactions",
]

[tool.pipelines_hooks.ste]
exempt = ["specs/*", "specs/**/*"]

[tool.pytest.ini_options]
markers = ["concept(id): associates a test with an existing concept identifier"]
