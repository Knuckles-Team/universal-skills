# Without this, `pre-commit install` wires ONLY the pre-commit hook, so `git push`
# runs nothing and every hook staged pre-push is silently dead code.
default_install_hook_types: [pre-commit, pre-push]
exclude:
  ^(.*\/scripts\/|.*skill_graphs\/|.*pnpm-lock\.yaml|.*uv\.lock|.*\.db$|.*\.bak$|.*\.sqlite$)
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
  hooks:
  - id: check-added-large-files
    args: ["--maxkb=2000"]
    exclude: ^uv\.lock$|.*\.db$|.*\.bak$|.*\.sqlite$
  - id: check-ast
    exclude: (^|/)(tests/|test/|scripts/|script/)
  - id: check-yaml
    args: ["--unsafe"]
  - id: check-toml
  - id: check-json
  - id: fix-byte-order-marker
    exclude: .gitignore
  - id: check-merge-conflict
  - id: detect-private-key
  - id: trailing-whitespace
  - id: end-of-file-fixer
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: 38bfb07c0c64c304f47eb52090f8288150c77730 # v0.17.1
  hooks:
  - id: ruff
    name: ruff check
    args: ["--fix", "--ignore=E402"]
    exclude: (^|/)(tests/|test/|scripts/|script/)
  - id: ruff-format
    name: ruff format
    exclude: (^|/)(tests/|test/|scripts/|script/)
- repo: https://github.com/pre-commit/mirrors-mypy
  rev: 2834ec6639549dd6796205c8f011dedcd587288b # v2.4.0
  hooks:
  - id: mypy
    args: ["--ignore-missing-imports", "--follow-imports=silent", "--show-column-numbers",
      "--no-error-summary", "--no-pretty"]
    exclude: (^|/)(tests/|test/|scripts/|script/)
    additional_dependencies: ["types-PyYAML==6.0.12.20260518", "types-requests==2.33.0.20260518", "types-setuptools==83.0.0.20260706",
      "types-toml==0.10.8.20260518"]
- repo: https://github.com/jendrikseipp/vulture
  rev: 258fe6a1974e89a2add9a45519a9e9dd9f46154e # v2.16
  hooks:
  - id: vulture
    pass_filenames: false
    args: [".", "--min-confidence", "95", "--exclude", "node_modules,dotnet,.venv,build,*.egg-info,.pytest_cache,.mypy_cache"]
    require_serial: true
    exclude: (^|/)(tests/|test/|scripts/|script/)
- repo: https://github.com/codespell-project/codespell
  rev: 57b21406f092110c18776e39b0bda50d37c945c8 # v2.4.3
  hooks:
  - id: codespell
    args: ["-I .codespellignore"]
    exclude: \.xsd$
- repo: https://github.com/PyCQA/bandit
  rev: 92ae8b82fb422a639f0ed8d99e96cea769594e08 # 1.9.4
  hooks:
  - id: bandit
    args: ["--skip", "B101,B404,B603"]
    exclude: ^(tests/|test/|scripts/|script/|__tests__/)
- repo: https://github.com/nbQA-dev/nbQA
  rev: f96ec7f3b26a32619435686eb5813235f7e3327e # 1.9.1
  hooks:
  - id: nbqa-ruff
    args: ["--fix"]
- repo: https://github.com/astral-sh/uv-pre-commit
  rev: d4acaec07ac3bc6017fba3c3b8e9810af1b615db # 0.13.1
  hooks:
  - id: uv-lock
- repo: local
  hooks:
  - id: mermaid-fence-check
    name: mermaid fenced-block structure
    entry: python scripts/check_mermaid_blocks.py
    language: python
    types: [markdown]
    pass_filenames: true
    exclude: .*universal_skills/research/comparative-analysis/references/report_template\.md$
  - id: check-agent-standards
    name: check agent standards
    entry: |-
      bash -c 'for f in $(find . -type f -name "agent_server.py" -not -path "*/\.venv/*" -not -path "*/__pycache__/*"); do grep -q "warnings.filterwarnings" "$f" && grep -q "file=sys.stderr" "$f" || { echo "Missing warnings.filterwarnings or file=sys.stderr in $f"; exit 1; }; done'
    language: system
    pass_filenames: false
    always_run: true
  - id: check-cli-help
    name: check cli help
    entry: |-
      bash -c 'for f in $(find . -type f \( -name "mcp_server.py" -o -name "agent_server.py" \) -not -path "*/\.venv/*" -not -path "*/__pycache__/*"); do mod=$(echo "$f" | sed -e "s/^\.\///" -e "s/\.py$//" -e "s/\//./g"); python3 scripts/gate_env.py --gate check-cli-help --project-env -- python -m "$mod" --help >/dev/null || exit 1; done'
    language: system
    pass_filenames: false
    always_run: true
  - id: check-bumpversion
    name: validate bumpversion config
    entry: bump2version patch --dry-run --allow-dirty
    language: python
    additional_dependencies: [bump2version==1.0.1]
    pass_filenames: false
    always_run: true
- repo: local
  hooks:
  - id: pytest
    name: pytest
    # The locked environment (all extras) comes from scripts/bootstrap.sh.
    entry: python3 scripts/gate_env.py --gate pytest --project-env -- python -m pytest tests -q --tb=short -p no:cacheprovider -n auto -m "not slow" --timeout=60
    language: system
    types: [python]
    pass_filenames: false
    always_run: true
- repo: local
  hooks:
  - id: security-sanitizer
    name: Security and Garbage Sanitizer
    entry: python scripts/security_sanitizer.py
    language: python
    pass_filenames: false
    always_run: true
- repo: local
  hooks:
  - id: check-path-portability
    name: cross-platform path portability
    entry: python scripts/check_path_portability.py . --max-path 200 --max-name 100 --max-violations 0
    language: system
    pass_filenames: false
    always_run: true
- repo: local
  hooks:
  - id: check-atomicity
    name: atomicity edict (atomic skills + dual-mode workflows)
    entry: python scripts/check_atomicity.py
    language: system
    pass_filenames: false
    always_run: true
- repo: local
  hooks:
  - id: skill-catalog-structure
    name: skill catalog structural integrity
    entry: python universal_skills/agent-tools/skill-catalog-auditor/scripts/audit_catalog.py universal_skills --fail-on error
    language: system
    pass_filenames: false
    always_run: true
- repo: local
  hooks:
  - id: check-frontmatter-portability
    name: cross-agent frontmatter portability (Codex + fleet)
    # Checks this repository's skills only, so the verdict does not depend on
    # which sibling checkouts happen to exist; each sibling gates its own.
    entry: python3 scripts/check_frontmatter_portability.py universal_skills --max-violations 0
    language: system
    pass_filenames: false
    always_run: true
