name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'specs/US-PAGES-001/**'
      - 'scripts/pages_sources.py'
      - '.github/workflows/pages.yml'

permissions:
  contents: read

jobs:
  publish-pages:
    uses: Knuckles-Team/pipelines/.github/workflows/pages_pipeline.yml@main
    permissions:
      contents: read
      pages: write
      id-token: write
