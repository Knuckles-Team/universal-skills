name: Pages check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install disposable documentation dependencies
        run: python -m pip install -r .github/requirements-pages.txt
      - name: Build and check local links
        run: python -m mkdocs build --strict --site-dir "$RUNNER_TEMP/pages-site"
      - name: Canonical sources and status contracts
        run: python -m pytest tests/pages_contracts.py -q
