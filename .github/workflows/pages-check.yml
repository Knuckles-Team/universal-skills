name: Pages check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install disposable documentation dependencies
        run: python -m pip install -r .github/requirements-pages.txt
      - name: Build and check local links
        run: python -m mkdocs build --strict --site-dir "$RUNNER_TEMP/pages-site"
      - name: Canonical sources and status contracts
        run: python -m pytest tests/pages_contracts.py -q
