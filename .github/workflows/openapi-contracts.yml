name: OpenAPI builder contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  openapi-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Knuckles-Team/agent-connector-sdk
          ref: 04a68087dbd3867bbb20e6ce286ffdd654028183
          path: .ci/agent-connector-sdk
          persist-credentials: false
      - name: Bootstrap reviewed SDK without native builds
        working-directory: .ci/agent-connector-sdk
        run: bash scripts/bootstrap.sh
      - name: Install required constraint validators as wheels
        run: |
          uv pip install --python .ci/agent-connector-sdk/.venv/bin/python --only-binary=:all: regex==2026.9.29 rfc3986-validator==0.1.1 rfc3339-validator==0.1.4
      - name: Test real governed transport and local-source publication boundaries
        env:
          MCP_BUILDER_REQUIRE_SDK: '1'
        run: .ci/agent-connector-sdk/.venv/bin/python -m pytest -q -ra tests/test_mcp_builder_openapi.py tests/test_mcp_builder_openapi_parity.py tests/test_mcp_builder_source_parity.py tests/test_mcp_builder_openapi_security.py tests/test_mcp_builder_unicode_patterns.py tests/test_mcp_builder_session_auth.py tests/test_mcp_builder_github_publish.py tests/test_mcp_builder_pages_publication.py tests/test_mcp_builder_schema_budget.py tests/test_mcp_builder_provider_overlay.py tests/test_mcp_builder_native_confirmation.py tests/test_mcp_builder_reviewed_redirect.py tests/test_mcp_builder_format_validation.py tests/test_mcp_builder_authorization_runtime.py
