name: CI

# The same gates a contributor runs locally: bootstrap, then this repository's
# own .pre-commit-config.yaml (which includes the full pytest suite). With CI
# set, a gate that cannot run fails (CANNOT RUN) instead of skipping.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Bootstrap
        run: scripts/bootstrap.sh
      - name: Pre-commit gates
        run: uvx pre-commit run --all-files --show-diff-on-failure

  mcp-builder-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Check out reviewed SDK contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Knuckles-Team/agent-connector-sdk
          ref: 5babc4cc48ad73928468b243842f219f51e2cca1
          path: .ci/agent-connector-sdk
          persist-credentials: false
      - name: Check out shared Pages contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Knuckles-Team/pipelines
          ref: 7b3d18d72b5622d455ece3bbe45a9482bc6e8b5e
          path: .ci/pipelines
          persist-credentials: false
      - name: Bootstrap repository build environment
        run: scripts/bootstrap.sh
      - name: Bootstrap SDK and its pinned generated EG client
        working-directory: .ci/agent-connector-sdk
        # Canonical SDK bootstrap uses its frozen lock and pinned EG source
        # contract, with --no-install-package epistemic-graph (no native build).
        run: bash scripts/bootstrap.sh
      - name: Install existing pinned Pages test requirements
        run: uv pip install --python .ci/agent-connector-sdk/.venv/bin/python -r .github/requirements-pages.txt
      - name: Require real SDK behavior and built artifact tests
        env:
          MCP_BUILDER_REQUIRE_SDK: '1'
          MCP_BUILDER_REQUIRE_SITE: '1'
          MCP_BUILDER_BUILD_PYTHON: ${{ github.workspace }}/.venv/bin/python
          PIPELINES_CONTRACT_ROOT: ${{ github.workspace }}/.ci/pipelines
          MCP_FLEET_REGISTRATION: 'false'
        run: |
          .ci/agent-connector-sdk/.venv/bin/python -m pytest -q -ra \
            tests/test_mcp_builder_smoke.py tests/test_mcp_builder_connector_contract.py \
            tests/test_mcp_builder_distribution.py tests/test_mcp_builder_surfaces.py \
            tests/test_mcp_builder_pages.py tests/test_mcp_builder_site.py \
            tests/test_mcp_builder_cli.py tests/test_mcp_builder_backend_docs.py
