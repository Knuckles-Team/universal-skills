name: CI

# The fleet CI standard (pipelines reference/ci-standard.md). A pull request runs
# the shared `gates` job (this repository's pre-commit gates over the diff) and
# the repository-specific jobs below; a push to main and the nightly schedule run
# the shared full gates, the full suite and the Python 3.12 backward leg. The
# caller aggregate `CI required` is the one required status check. This workflow
# never publishes: only a v* tag publishes (pipeline.yml, pages.yml).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}-{1}', github.workflow, github.event.pull_request.number) || format('main-{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gates:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: Knuckles-Team/pipelines/.github/workflows/gates_pipeline.yml@main
    with:
      setup-command: scripts/bootstrap.sh

  gates-all-files:
    # Main and nightly keep the whole-tree pre-commit run the repository ran on every pull request.
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
    uses: Knuckles-Team/pipelines/.github/workflows/gates_pipeline.yml@main
    with:
      all-files: true
      setup-command: scripts/bootstrap.sh
      timeout-minutes: 60

  full:
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
    uses: Knuckles-Team/pipelines/.github/workflows/main_pipeline.yml@main
    with:
      backward-python: '3.12'
      setup-command: scripts/bootstrap.sh

  # Repository-specific jobs: kept from the former separate workflows; CI required depends on each.
  backward-python:
    # The one backward-support leg (pipelines reference/gate-standard.md
    # "Python version"): the environment is 3.14, requires-python keeps a 3.12
    # floor, so install the lock on 3.12 and import the package.
    name: backward-python (3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: '3.12'
      - name: Install and import on the 3.12 floor
        run: |
          set -euo pipefail
          uv sync --frozen --no-dev --python 3.12
          uv run --frozen --no-sync python -c 'import sys, universal_skills; print(sys.version)'

  connector-scaffold:
    # Generates a connector, installs it and runs the SDK conformance plugin, the
    # pipelines connector gates and the ontology graph check (US-MCP-BUILDER-R011).
    # Nothing in this job may skip.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          python-version: '3.14'
      - name: Install the SDK, the pipelines hooks and test tools
        run: |
          uv venv /tmp/scaffold-venv
          # pipelines-hooks pins pydantic==2.13.5 while scion-sdk needs >=2.14.1.
          echo "pydantic>=2.14.1" > /tmp/scaffold-overrides.txt
          uv pip install --refresh --python /tmp/scaffold-venv/bin/python --override /tmp/scaffold-overrides.txt pytest rdflib pyyaml codespell \
            "scion-sdk[mcp]>=0.5.6,<0.6" \
            "pipelines-hooks @ git+https://github.com/Knuckles-Team/pipelines@main"
          # The SDK pytest plugin resolves this repository's own connector declaration.
          uv pip install --python /tmp/scaffold-venv/bin/python --no-deps -e .
      - name: Scaffold tests
        run: |
          set -o pipefail
          /tmp/scaffold-venv/bin/python -m pytest tests/test_mcp_builder_connector_scaffold.py -q -rs -p no:cacheprovider | tee /tmp/scaffold.out
          if grep -q skipped /tmp/scaffold.out; then echo "a scaffold test skipped" >&2; exit 1; fi

  mcp-builder-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
      - name: Check out reviewed SDK contract
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: Knuckles-Team/scion-sdk
          ref: 16908f3591e80be84b6bd5df356b4a2e9a666010
          path: .ci/scion-sdk
          persist-credentials: false
      - name: Check out shared Pages contract
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: Knuckles-Team/pipelines
          ref: 3c6158a5fd7c938ed57347279401e0991c174448
          path: .ci/pipelines
          persist-credentials: false
      - name: Bootstrap repository build environment
        run: scripts/bootstrap.sh
      - name: Bootstrap SDK and its pinned generated EG client
        working-directory: .ci/scion-sdk
        # Canonical SDK bootstrap uses its frozen lock and pinned EG source
        # contract, with --no-install-package epistemic-graph (no native build).
        run: bash scripts/bootstrap.sh
      - name: Install existing pinned Pages test requirements
        run: uv pip install --python .ci/scion-sdk/.venv/bin/python -r .github/requirements-pages.txt
      - name: Require real SDK behavior and built artifact tests
        env:
          MCP_BUILDER_REQUIRE_SDK: '1'
          MCP_BUILDER_REQUIRE_SITE: '1'
          MCP_BUILDER_BUILD_PYTHON: ${{ github.workspace }}/.venv/bin/python
          PIPELINES_CONTRACT_ROOT: ${{ github.workspace }}/.ci/pipelines
          MCP_FLEET_REGISTRATION: 'false'
        run: |
          .ci/scion-sdk/.venv/bin/python -m pytest -q -ra \
            tests/test_mcp_builder_site.py

  openapi-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: Knuckles-Team/scion-sdk
          ref: 16908f3591e80be84b6bd5df356b4a2e9a666010
          path: .ci/scion-sdk
          persist-credentials: false
      - name: Bootstrap reviewed SDK without native builds
        working-directory: .ci/scion-sdk
        run: bash scripts/bootstrap.sh
      - name: Install required constraint validators as wheels
        run: |
          uv pip install --python .ci/scion-sdk/.venv/bin/python --only-binary=:all: regex==2026.9.29 rfc3986-validator==0.1.1 rfc3339-validator==0.1.4
      - name: Test real governed transport and local-source publication boundaries
        env:
          MCP_BUILDER_REQUIRE_SDK: '1'
        run: .ci/scion-sdk/.venv/bin/python -m pytest -q -ra tests/test_mcp_builder_openapi.py tests/test_mcp_builder_openapi_parity.py tests/test_mcp_builder_source_parity.py tests/test_mcp_builder_openapi_security.py tests/test_mcp_builder_unicode_patterns.py tests/test_mcp_builder_session_auth.py tests/test_mcp_builder_github_publish.py tests/test_mcp_builder_pages_publication.py tests/test_mcp_builder_schema_budget.py tests/test_mcp_builder_provider_overlay.py tests/test_mcp_builder_native_confirmation.py tests/test_mcp_builder_reviewed_redirect.py tests/test_mcp_builder_format_validation.py tests/test_mcp_builder_authorization_runtime.py

  build-and-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Install disposable documentation dependencies
        run: python -m pip install -r .github/requirements-pages.txt
      - name: Build and check local links
        run: python -m mkdocs build --strict --site-dir "$RUNNER_TEMP/pages-site"
      - name: Canonical sources and status contracts
        run: python -m pytest tests/pages_contracts.py -q

  ci-required:
    name: CI required
    if: always()
    needs:
      - gates
      - gates-all-files
      - full
      - backward-python
      - connector-scaffold
      - mcp-builder-contracts
      - openapi-contracts
      - build-and-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail on any failed or cancelled job (skipped is fine)
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needed job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in failure|cancelled) echo "::error::a required job ended $r"; exit 1;; esac
          done
